<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuggyPoster</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>
  <label for="headline">headline</label>
  <input id="headline" type="text" placeholder="write something" />
  
</p>

<p>
  <label for="grass-color">grass color</label>
  <input id="grass-color" type="color" value="#ffff00" />
  <output for="grass-color"></output>
</p>

<p>
  <label for="ladybug-x">ladybug x</label>
  <input id="ladybug-x" type="range" min="0" max="400" value="100" />
  <label for="ladybug-y">ladybug y</label>
  <input id="ladybug-y" type="range" min="0" max="400" value="110" />
  <label for="ladybug-scale">ladybug scale</label>
  <input id="ladybug-scale" type="range" min="0.1" max="3" step="0.1" value="1" />
  <output for="ladybug-scale"></output>
  <label for="ladybug-rotation">ladybug rotation</label>
  <input id="ladybug-rotation" type="range" min="1" max="360" step="1" value="1" />
  <output for="ladybug-rotation"></output>
</p>

<p>
  <label for="butterfly-x">butterfly x</label>
  <input id="butterfly-x" type="range" min="0" max="400" value="100" />
  <label for="butterfly-y">butterfly y</label>
  <input id="butterfly-y" type="range" min="0" max="400" value="110" />
  <label for="butterfly-scale">butterfly scale</label>
  <input id="butterfly-scale" type="range" min="0.1" max="3" step="0.1" value="1" />
  <output for="butterfly-scale"></output>
  <label for="butterfly-rotation">butterfly rotation</label>
  <input id="butterfly-rotation" type="range" min="1" max="360" step="1" value="1" />
  <output for="butterfly-rotation"></output>
</p>

<p>
  <label for="caterpillar-x">caterpillar x</label>
  <input id="caterpillar-x" type="range" min="0" max="400" value="100" />
  <label for="caterpillar-y">caterpillar y</label>
  <input id="caterpillar-y" type="range" min="0" max="400" value="110" />
  <label for="caterpillar-scale">caterpillar scale</label>
  <input id="caterpillar-scale" type="range" min="0.1" max="3" step="0.1" value="1" />
  <output for="caterpillar-scale"></output>
  <label for="caterpillar-rotation">caterpillar rotation</label>
  <input id="caterpillar-rotation" type="range" min="1" max="360" step="1" value="1" />
  <output for="caterpillar-rotation"></output>
</p>

<div id="bg">
  <div id="grass-overlay"></div>
  <img id="grass" src="assets/grass.JPG" alt="beautiful green grass">
  <h1 class="headline" id="word" style="font-size: 6rem; color: white;">hello</h1>
  <img class="bugs" id="ladybug" src="assets/ladybug.png" alt="ladybug">
  <img class="bugs" id="butterfly" src="assets/butterfly.png" alt="butterfly">
  <img class="bugs" id="caterpillar" src="assets/caterpillar.png" alt="caterpillar">
</div>

<script src="poster.js"></script>
</body>
</html>
